config-version = 2
start-at-login = false

# Keep mouse centered on the active window when switching via keyboard
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Normalization settings
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

# Keep workspaces 1-3 pinned
persistent-workspaces = ['1', '2', '3']

[gaps]
inner.horizontal = 8
inner.vertical =   8
outer.left =       8
outer.bottom =     8
outer.top =        8
outer.right =      8

[mode.main.binding]
# --- App Launchers ---
alt-enter = '''exec-and-forget osascript -e '
if application "iTerm" is running then
    tell application "iTerm" to create window with default profile
else
    tell application "iTerm" to activate
end if' '''
alt-shift-enter = 'exec-and-forget open -a "Firefox"'

# --- Vim Directional Focus ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- Promote Active Window to Master (Leftmost Slot) ---
cmd-j = ['move left', 'move left']

# --- Window Movement & Stack Grouping ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-ctrl-h = 'join-with left'
alt-ctrl-j = 'join-with down'
alt-ctrl-k = 'join-with up'
alt-ctrl-l = 'join-with right'

# --- Layout & Fullscreen (Leaves Cmd+F untouched) ---
alt-f = 'fullscreen'
alt-shift-f = 'fullscreen --no-outer-gaps'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-space = 'layout floating tiling'

# --- Master/Stack Sizing (85px steps + 60/40 Presets) ---
alt-minus = 'resize smart -85'
alt-equal = 'resize smart +85'
alt-m = ['balance-sizes', 'resize width -170']
alt-shift-m = ['join-with up', 'focus left', 'balance-sizes', 'resize width -170']
alt-0 = 'balance-sizes'

# --- Scratchpad / Park Workspace ---
alt-shift-s = 'move-node-to-workspace S'
alt-s = 'workspace S'

# --- Workspaces on Ctrl + 1..9 (Keeps Alt + 1..9 free for terminal/tmux) ---
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

#ctrl-left = 'workspace --wrap-around prev'
#ctrl-right = 'workspace --wrap-around next'

ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'
ctrl-shift-4 = 'move-node-to-workspace 4'
ctrl-shift-5 = 'move-node-to-workspace 5'
ctrl-shift-6 = 'move-node-to-workspace 6'
ctrl-shift-7 = 'move-node-to-workspace 7'
ctrl-shift-8 = 'move-node-to-workspace 8'
ctrl-shift-9 = 'move-node-to-workspace 9'

# --- Service Mode ---
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Put certain apps on certain desktops
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 1', 'workspace 1']

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['move-node-to-workspace 2', 'workspace 2']

[[on-window-detected]]
if.app-id = 'org.pwmt.zathura'
run = ['move-node-to-workspace 3', 'workspace 3']

# --- Floating Overlays ---
[[on-window-detected]]
if.app-id = 'cc.ffitch.shottr'
run = 'layout floating'
